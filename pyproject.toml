[project]
name = "habibi_telegram"
authors = [
    { name = "DHI Partners", email = "dosnet2200@gmail.com"}
]
description = "Telegram Bot Manager for Frappe"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Никаких внешних зависимостей: Telegram Bot API — это обычный HTTPS+JSON,
    # requests приходит вместе с frappe.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.format]
# Отступы табами — как во всей экосистеме frappe
indent-style = "tab"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    "E101",  # смешанные отступы: у frappe табы
    "W191",  # отступы табами — это норма здесь
    "E501",  # длина строки — на совести автора
    "B904",  # raise ... from ... не обязателен внутри frappe.throw
]
