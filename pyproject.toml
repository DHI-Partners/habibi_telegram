[project]
name = "habibi_telegram"
authors = [
    { name = "DHI Partners", email = "dosnet2200@gmail.com"}
]
description = "Telegram Bot Manager for Frappe"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Bot API — обычный HTTPS+JSON, для него ничего не нужно: requests приходит
    # вместе с frappe.
    #
    # А вот личный аккаунт живёт на MTProto: свой бинарный протокол со своей
    # криптографией, руками его не написать. Telethon — единственная зрелая
    # реализация на чистом Python; импортируется лениво, так что без него
    # работает всё, кроме раздела Telegram Account.
    "telethon>=1.36,<2",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.format]
# Отступы табами — как во всей экосистеме frappe
indent-style = "tab"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    "E101",  # смешанные отступы: у frappe табы
    "W191",  # отступы табами — это норма здесь
    "E501",  # длина строки — на совести автора
    "B904",  # raise ... from ... не обязателен внутри frappe.throw
]
